  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0e0f13;
    --bg2: #15161c;
    --bg3: #1c1d26;
    --bg4: #23242f;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --text: #f0f0f5;
    --text2: #9898aa;
    --text3: #5a5a70;
    --accent: #c9a96e;
    --accent2: #e8c88a;
    --accent-bg: rgba(201,169,110,0.1);
    --accent-border: rgba(201,169,110,0.3);
    --green: #4caf82;
    --green-bg: rgba(76,175,130,0.1);
    --red: #e05a5a;
    --red-bg: rgba(224,90,90,0.1);
    --blue: #5a9fe0;
    --blue-bg: rgba(90,159,224,0.1);

    --yellow-bg: rgba(224,192,90,0.1);
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
  }
  html, body, #root { height: 100%; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }
  button { font-family: 'DM Sans', sans-serif; cursor: pointer; }
  input, textarea, select { font-family: 'DM Sans', sans-serif; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 3px; }

  /* Layout */
  .app { display: flex; height: 100vh; }
  .sidebar { width: 240px; min-width: 240px; background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 24px 0; }
  .sidebar-logo { padding: 0 20px 24px; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
  .sidebar-logo h1 { font-family: 'Playfair Display', serif; font-size: 20px; color: var(--accent); letter-spacing: 0.5px; }
  .sidebar-logo p { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .sidebar-nav { flex: 1; padding: 8px 12px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius-sm); color: var(--text2); font-size: 14px; font-weight: 400; cursor: pointer; transition: all 0.15s; margin-bottom: 2px; border: none; background: none; width: 100%; text-align: left; }
  .nav-item:hover { background: var(--bg3); color: var(--text); }
  .nav-item.active { background: var(--accent-bg); color: var(--accent); border: 1px solid var(--accent-border); }
  .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
  .main { flex: 1; overflow-y: auto; background: var(--bg); }
  .page { padding: 36px 40px; max-width: 1100px; }
  .page-header { margin-bottom: 32px; }
  .page-title { font-family: 'Playfair Display', serif; font-size: 32px; font-weight: 600; color: var(--text); }
  .page-subtitle { font-size: 14px; color: var(--text2); margin-top: 6px; }

  /* Cards */
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
  .card-sm { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 16px; }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; border: none; transition: all 0.15s; }
  .btn-primary { background: var(--accent); color: #1a1200; }
  .btn-primary:hover { background: var(--accent2); }
  .btn-ghost { background: transparent; color: var(--text2); border: 1px solid var(--border2); }
  .btn-ghost:hover { background: var(--bg3); color: var(--text); }
  .btn-danger { background: var(--red-bg); color: var(--red); border: 1px solid rgba(224,90,90,0.2); }
  .btn-danger:hover { background: rgba(224,90,90,0.2); }
  .btn-sm { padding: 6px 12px; font-size: 13px; }
  .btn-icon { padding: 8px; border-radius: var(--radius-sm); background: var(--bg3); border: 1px solid var(--border); color: var(--text2); transition: all 0.15s; }
  .btn-icon:hover { color: var(--text); border-color: var(--border2); }

  /* Forms */
  .form-group { margin-bottom: 16px; }
  .form-label { display: block; font-size: 13px; color: var(--text2); margin-bottom: 6px; font-weight: 500; }
  .form-input { width: 100%; background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--radius-sm); padding: 10px 14px; color: var(--text); font-size: 14px; transition: border-color 0.15s; outline: none; }
  .form-input:focus { border-color: var(--accent); }
  .form-input::placeholder { color: var(--text3); }
  textarea.form-input { resize: vertical; min-height: 80px; }
  select.form-input { appearance: none; cursor: pointer; }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .grid-auto { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }

  .tab { padding: 10px 16px; font-size: 14px; color: var(--text2); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; background: none; border-top: none; border-left: none; border-right: none; }

  /* Checklist item */
  .check-item { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .check-item:last-child { border-bottom: none; }
  .check-item.done .check-text { text-decoration: line-through; color: var(--text3); }
  .checkbox { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--border2); background: var(--bg3); flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; margin-top: 1px; }

  .confidence { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; }
  .conf-dot { width: 8px; height: 8px; border-radius: 50%; }

  /* Loader */
  .loader { display: flex; align-items: center; gap: 8px; color: var(--text2); font-size: 14px; }
  .spinner { width: 18px; height: 18px; border: 2px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Compare */
  .compare-col { flex: 1; min-width: 0; }
  .compare-row { display: flex; gap: 16px; }
  .compare-header { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; text-align: center; margin-bottom: 16px; position: relative; }

  .section-divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; color: var(--text3); font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; }
  .section-divider::before, .section-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* Day card */
  .day-card { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 16px; }

  .day-number { font-family: 'Playfair Display', serif; font-size: 16px; color: var(--accent); }
  .day-body { padding: 16px 18px; }

  /* Toast */
  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--radius-sm); padding: 12px 18px; font-size: 14px; z-index: 9999; animation: slideIn 0.2s ease; box-shadow: var(--shadow); }
  @keyframes slideIn { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  .empty-state .emoji { font-size: 48px; margin-bottom: 16px; }
  .empty-state h3 { font-size: 18px; color: var(--text2); margin-bottom: 8px; }

  .divider { height: 1px; background: var(--border); margin: 20px 0; }

  .flex { display: flex; }
  .items-center { align-items: center; }
  .justify-between { justify-content: space-between; }

const fmt = (v) => v ? `R$ ${Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2 })}` : '—';

const ANTHROPIC_KEY = null; // injected at runtime from meta tag
async function callClaude(prompt, systemPrompt = '') {
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 2000,
      system: systemPrompt || 'Você é um assistente de viagens especialista. Responda sempre em JSON válido, sem markdown, sem explicações fora do JSON.',
      messages: [{ role: 'user', content: prompt }]
    })
  });
  const data = await res.json();
  return data.content?.[0]?.text || '';
}

// ─── Toast ────────────────────────────────────────────────────────────────────
function Toast({ message, onClose }) {
  useEffect(() => { const t = setTimeout(onClose, 3000); return () => clearTimeout(t); }, []);
  return <div className="toast">{message}</div>;
}

// ─── Confidence Badge ─────────────────────────────────────────────────────────
function Confidence({ level }) {
  const map = {
    high: { color: '#4caf82', label: 'Confirmado', dot: '#4caf82' },
    medium: { color: '#e0c05a', label: 'Estimado', dot: '#e0c05a' },
    low: { color: '#e05a5a', label: 'Incerto', dot: '#e05a5a' },
  };
  const c = map[level] || map.medium;
  return (
    <span className="confidence" style={{ color: c.color }}>
      <span className="conf-dot" style={{ background: c.dot }} />
      {c.label}
    </span>
  );
}

// ─── Firestore helpers ────────────────────────────────────────────────────────
const COL = 'destinations';

async function loadDestinations() {
  const snap = await db.collection(COL).orderBy('createdAt', 'desc').get();
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
}
async function saveDestination(dest) {
  if (dest.id) {
    await db.collection(COL).doc(dest.id).set(dest, { merge: true });
    return dest.id;
  } else {
    const ref = await db.collection(COL).add({ ...dest, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    return ref.id;
  }
}
async function deleteDestination(id) {
  await db.collection(COL).doc(id).delete();
}

// ─── AI Generation ────────────────────────────────────────────────────────────
async function generateDestinationData(name) {
  const prompt = `Gere dados de viagem para: "${name}"
Responda APENAS com JSON neste formato exato:
{
  "attractions": [
    { "name": "Nome da atração", "price": 25, "currency": "EUR", "priceConfidence": "high", "category": "museu", "description": "Breve descrição", "tip": "Dica útil" }
  ],
  "touristPass": {
    "exists": true,
    "name": "Nome do Pass",
    "price": 60,
    "currency": "EUR",
    "duration": "2 dias",
    "includes": ["Atração 1", "Atração 2"],
    "activationNote": "Deve ser ativado no 1º uso, válido por 48h corridas",
    "buyLink": "https://..."
  },
  "cityTips": {
    "currency": "Euro (€)",
    "transport": "Metrô eficiente, vale comprar passe semanal ~€30",
    "bestSeason": "Primavera (abr-jun) e outono (set-out)",
    "language": "Italiano",
    "safety": "Cidade segura, atenção a pickpockets em pontos turísticos",
    "payment": "Maioria aceita cartão, mas leve algum dinheiro para mercados"
  }
}
priceConfidence pode ser: "high" (preço oficial conhecido), "medium" (estimativa com boa referência), "low" (muito variável ou incerto)
Se não houver tourist pass, coloque "exists": false nos outros campos coloque null.`;

  const raw = await callClaude(prompt);
  try {
    const clean = raw.replace(/```json\n?/g, '').replace(/```\n?/g, '').trim();
    return JSON.parse(clean);
  } catch {
    return null;
  }
}

// ─── Modal: New Destination ───────────────────────────────────────────────────
function NewDestinationModal({ onClose, onSave }) {
  const [step, setStep] = useState('form'); // form | generating | done
  const [name, setName] = useState('');
  const [dates, setDates] = useState({ from: '', to: '' });
  const [costs, setCosts] = useState({ flight: '', hotel: '', other: '' });
  const [generatedData, setGeneratedData] = useState(null);

  const handleGenerate = async () => {
    if (!name.trim()) return;
    setStep('generating');
    const data = await generateDestinationData(name);
    setGeneratedData(data);
    setStep('done');
  };

  const handleSave = async () => {
    const dest = {
      name: name.trim(),
      emoji: getEmoji(name),
      dates,
      costs,
      attractions: generatedData?.attractions || [],
      touristPass: generatedData?.touristPass || null,
      cityTips: generatedData?.cityTips || null,
      itinerary: [],
    };
    await onSave(dest);
    onClose();
  };

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <div className="modal-header">
          <h2 className="modal-title">Novo destino</h2>
          <button className="btn-icon" onClick={onClose}><Icon name="x" /></button>
        </div>
        <div className="modal-body">
          {step === 'form' && (
            <>
              <div className="form-group">
                <label className="form-label">Destino</label>
                <input className="form-input" placeholder="Ex: Roma, Itália" value={name} onChange={e => setName(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleGenerate()} />
              </div>
              <div className="grid-2">
                <div className="form-group">
                  <label className="form-label">Data de ida</label>
                  <input type="date" className="form-input" value={dates.from} onChange={e => setDates(d => ({ ...d, from: e.target.value }))} />
                </div>
                <div className="form-group">
                  <label className="form-label">Data de volta</label>
                  <input type="date" className="form-input" value={dates.to} onChange={e => setDates(d => ({ ...d, to: e.target.value }))} />
                </div>
              </div>
              <div className="section-divider">custos estimados (R$)</div>
              <div className="grid-3">
                <div className="form-group">
                  <label className="form-label">✈️ Passagem</label>
                  <input type="number" className="form-input" placeholder="0,00" value={costs.flight} onChange={e => setCosts(c => ({ ...c, flight: e.target.value }))} />
                </div>
                <div className="form-group">
                  <label className="form-label">🏨 Hospedagem</label>
                  <input type="number" className="form-input" placeholder="0,00" value={costs.hotel} onChange={e => setCosts(c => ({ ...c, hotel: e.target.value }))} />
                </div>
                <div className="form-group">
                  <label className="form-label">💳 Outros</label>
                  <input type="number" className="form-input" placeholder="0,00" value={costs.other} onChange={e => setCosts(c => ({ ...c, other: e.target.value }))} />
                </div>
              </div>
            </>
          )}

          {step === 'generating' && (
            <div style={{ padding: '40px 0', textAlign: 'center' }}>
              <div className="loader" style={{ justifyContent: 'center', marginBottom: 16 }}>
                <div className="spinner" />
                <span>Buscando informações sobre {name}...</span>
              </div>
              <p className="text-sm text-muted">IA pesquisando atrações, preços e dicas locais</p>
            </div>
          )}

          {step === 'done' && generatedData && (
            <div>
              <p className="text-sm text-muted mb-16">✅ Dados gerados para <strong style={{color:'var(--text)'}}>{name}</strong>. Revise abaixo antes de salvar.</p>
              {generatedData.touristPass?.exists && (
                <div className="card-sm mb-16" style={{ borderLeft: '3px solid var(--accent)', borderRadius: '0 8px 8px 0' }}>
                  <div className="flex items-center gap-8 mb-8">
                    <Icon name="ticket" size={16} />
                    <span className="text-sm" style={{ fontWeight: 500 }}>Tourist Pass disponível: {generatedData.touristPass.name}</span>
                    <span className="badge badge-accent">{generatedData.touristPass.price} {generatedData.touristPass.currency}</span>
                  </div>
                  <p className="text-xs text-muted">{generatedData.touristPass.activationNote}</p>
                </div>
              )}
              <p className="text-sm text-muted" style={{ marginBottom: 12 }}>
                <strong style={{ color: 'var(--text)' }}>{generatedData.attractions?.length || 0} atrações</strong> encontradas — você poderá editar preços depois.
              </p>
            </div>
          )}
        </div>
        <div className="modal-footer">
          <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
          {step === 'form' && (
            <button className="btn btn-primary" onClick={handleGenerate} disabled={!name.trim()}>
              <Icon name="spark" size={16} /> Gerar com IA
            </button>
          )}
          {step === 'done' && (
            <button className="btn btn-primary" onClick={handleSave}>
              Salvar destino
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

// ─── Destination Detail ───────────────────────────────────────────────────────
function DestinationDetail({ dest, onUpdate, onBack }) {
  const [activeTab, setActiveTab] = useState('atrações');
  const [editingAttr, setEditingAttr] = useState(null);
  const [editVal, setEditVal] = useState('');
  const [editCosts, setEditCosts] = useState(dest.costs || {});
  const [editingCosts, setEditingCosts] = useState(false);
  const [newDay, setNewDay] = useState('');
  const [newActivity, setNewActivity] = useState({ day: null, text: '' });

  const saveCosts = async () => {
    await onUpdate({ ...dest, costs: editCosts });
    setEditingCosts(false);
  };

  const saveAttrPrice = async (idx, val) => {
    const updated = [...dest.attractions];
    updated[idx] = { ...updated[idx], price: parseFloat(val) || 0, priceConfidence: 'medium' };
    await onUpdate({ ...dest, attractions: updated });
    setEditingAttr(null);
  };

  const addDay = async () => {
    if (!newDay.trim()) return;
    const itinerary = [...(dest.itinerary || []), { date: newDay, activities: [], expanded: true }];
    await onUpdate({ ...dest, itinerary });
    setNewDay('');
  };

  const addActivity = async (dayIdx) => {
    if (!newActivity.text.trim()) return;
    const itinerary = [...(dest.itinerary || [])];
    itinerary[dayIdx].activities = [...(itinerary[dayIdx].activities || []), { text: newActivity.text, done: false }];
    await onUpdate({ ...dest, itinerary });
    setNewActivity({ day: null, text: '' });
  };

  const toggleActivity = async (dayIdx, actIdx) => {
    const itinerary = JSON.parse(JSON.stringify(dest.itinerary || []));
    itinerary[dayIdx].activities[actIdx].done = !itinerary[dayIdx].activities[actIdx].done;
    await onUpdate({ ...dest, itinerary });
  };

  const removeActivity = async (dayIdx, actIdx) => {
    const itinerary = JSON.parse(JSON.stringify(dest.itinerary || []));
    itinerary[dayIdx].activities.splice(actIdx, 1);
    await onUpdate({ ...dest, itinerary });
  };

  const days = dest.dates?.from && dest.dates?.to
    ? Math.ceil((new Date(dest.dates.to) - new Date(dest.dates.from)) / 86400000) : null;

  return (
    <div className="page">
      <div className="flex items-center gap-12 mb-16">
        <button className="btn btn-ghost btn-sm" onClick={onBack}>← Voltar</button>
      </div>
      <div className="page-header flex items-center gap-12">
        <span style={{ fontSize: 48 }}>{dest.emoji}</span>
        <div>
          <h1 className="page-title">{dest.name}</h1>
          <p className="page-subtitle">
            {dest.dates?.from && `${new Date(dest.dates.from + 'T12:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' })}`}
            {dest.dates?.to && ` → ${new Date(dest.dates.to + 'T12:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' })}`}
            {days && ` · ${days} dias`}
          </p>
        </div>
      </div>

      {/* Custos */}
      <div className="card mb-24">
        <div className="flex justify-between items-center mb-16">
          <span style={{ fontWeight: 500 }}>Custos estimados</span>
          {!editingCosts
            ? <button className="btn btn-ghost btn-sm" onClick={() => setEditingCosts(true)}><Icon name="edit" size={14} /> Editar</button>
            : <button className="btn btn-primary btn-sm" onClick={saveCosts}><Icon name="check" size={14} /> Salvar</button>
          }
        </div>
        {editingCosts ? (
          <div className="grid-3">
            <div className="form-group" style={{ marginBottom: 0 }}>
              <label className="form-label">✈️ Passagem (R$)</label>
              <input type="number" className="form-input" value={editCosts.flight || ''} onChange={e => setEditCosts(c => ({ ...c, flight: e.target.value }))} />
            </div>
            <div className="form-group" style={{ marginBottom: 0 }}>
              <label className="form-label">🏨 Hospedagem (R$)</label>
              <input type="number" className="form-input" value={editCosts.hotel || ''} onChange={e => setEditCosts(c => ({ ...c, hotel: e.target.value }))} />
            </div>
            <div className="form-group" style={{ marginBottom: 0 }}>
              <label className="form-label">💳 Outros (R$)</label>
              <input type="number" className="form-input" value={editCosts.other || ''} onChange={e => setEditCosts(c => ({ ...c, other: e.target.value }))} />
            </div>
          </div>
        ) : (
          <div className="grid-3">
            {[['✈️ Passagem', dest.costs?.flight], ['🏨 Hospedagem', dest.costs?.hotel], ['💳 Outros', dest.costs?.other]].map(([label, val]) => (
              <div key={label} style={{ background: 'var(--bg3)', borderRadius: 8, padding: '12px 16px' }}>
                <p className="text-xs text-muted mb-8">{label}</p>
                <p style={{ fontSize: 18, fontWeight: 500, color: val ? 'var(--accent)' : 'var(--text3)' }}>{val ? fmtSimple(val) : '—'}</p>
              </div>
            ))}
          </div>
        )}
        {(() => {
          const total = (Number(dest.costs?.flight) || 0) + (Number(dest.costs?.hotel) || 0) + (Number(dest.costs?.other) || 0);
          return total > 0 ? (
            <div className="mt-16" style={{ textAlign: 'right', color: 'var(--text2)', fontSize: 14 }}>
              Total estimado: <span style={{ color: 'var(--accent)', fontWeight: 600, fontSize: 18 }}>{fmtSimple(total)}</span>
            </div>
          ) : null;
        })()}
      </div>

      <div className="tabs">
        {['atrações', 'roteiro', 'dicas'].map(t => (
          <button key={t} className={`tab ${activeTab === t ? 'active' : ''}`} onClick={() => setActiveTab(t)}>
            {t.charAt(0).toUpperCase() + t.slice(1)}
          </button>
        ))}
      </div>

      {/* Atrações */}
      {activeTab === 'atrações' && (
        <div>
          {dest.touristPass?.exists && (
            <div className="card mb-16" style={{ borderLeft: '3px solid var(--accent)', borderRadius: '0 12px 12px 0' }}>
              <div className="flex items-center gap-8 mb-8">
                <Icon name="ticket" />
                <span style={{ fontWeight: 500 }}>Tourist Pass: {dest.touristPass.name}</span>
                <span className="badge badge-accent">{dest.touristPass.price} {dest.touristPass.currency} / {dest.touristPass.duration}</span>
              </div>
              <p className="text-sm text-muted mb-8">⚠️ {dest.touristPass.activationNote}</p>
              {dest.touristPass.includes?.length > 0 && (
                <p className="text-sm text-muted">Inclui: {dest.touristPass.includes.join(', ')}</p>
              )}
            </div>
          )}

          {(dest.attractions || []).length === 0 ? (
            <div className="empty-state">
              <div className="emoji">🎭</div>
              <h3>Nenhuma atração</h3>
            </div>
          ) : (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
              {(dest.attractions || []).map((attr, i) => (
                <div key={i} className="card-sm flex justify-between items-center" style={{ gap: 12 }}>
                  <div style={{ flex: 1 }}>
                    <div className="flex items-center gap-8 mb-4">
                      <span style={{ fontWeight: 500, fontSize: 14 }}>{attr.name}</span>
                      <span className="badge badge-blue text-xs">{attr.category}</span>
                    </div>
                    <p className="text-xs text-muted">{attr.description}</p>
                    {attr.tip && <p className="text-xs" style={{ color: 'var(--accent)', marginTop: 4 }}>💡 {attr.tip}</p>}
                  </div>
                  <div style={{ textAlign: 'right', flexShrink: 0 }}>
                    {editingAttr === i ? (
                      <div className="flex items-center gap-8">
                        <input type="number" className="form-input" style={{ width: 80 }} value={editVal} onChange={e => setEditVal(e.target.value)} autoFocus />
                        <button className="btn-icon" onClick={() => saveAttrPrice(i, editVal)}><Icon name="check" size={14} /></button>
                      </div>
                    ) : (
                      <div className="flex items-center gap-8">
                        <div>
                          <p style={{ fontWeight: 500, color: 'var(--accent)' }}>
                            {attr.price ? `${attr.price} ${attr.currency || 'EUR'}` : 'Gratuito'}
                          </p>
                          <Confidence level={attr.priceConfidence} />
                        </div>
                        <button className="btn-icon" onClick={() => { setEditingAttr(i); setEditVal(attr.price || ''); }}>
                          <Icon name="edit" size={14} />
                        </button>
                      </div>
                    )}
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {/* Roteiro */}
      {activeTab === 'roteiro' && (
        <div>
          <div className="flex gap-8 mb-16">
            <input type="date" className="form-input" style={{ width: 'auto', flex: 1 }} value={newDay} onChange={e => setNewDay(e.target.value)} />
            <button className="btn btn-primary" onClick={addDay}><Icon name="plus" size={16} /> Adicionar dia</button>
          </div>
          {(dest.itinerary || []).length === 0 ? (
            <div className="empty-state">
              <div className="emoji">📅</div>
              <h3>Nenhum dia no roteiro</h3>
              <p>Adicione dias para organizar suas atividades</p>
            </div>
          ) : (
            (dest.itinerary || []).map((day, di) => {
              const done = (day.activities || []).filter(a => a.done).length;
              const total = (day.activities || []).length;
              return (
                <div key={di} className="day-card">
                  <div className="day-header">
                    <div>
                      <span className="day-number">Dia {di + 1}</span>
                      <span className="text-sm text-muted" style={{ marginLeft: 12 }}>
                        {new Date(day.date + 'T12:00:00').toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' })}
                      </span>
                    </div>
                    {total > 0 && <span className="badge badge-green">{done}/{total} feitos</span>}
                  </div>
                  <div className="day-body">
                    {(day.activities || []).map((act, ai) => (
                      <div key={ai} className={`check-item ${act.done ? 'done' : ''}`}>
                        <div
                          className={`checkbox ${act.done ? 'checked' : ''}`}
                          onClick={() => toggleActivity(di, ai)}
                        >
                          {act.done && <Icon name="check" size={12} />}
                        </div>
                        <span className="check-text" style={{ flex: 1, fontSize: 14 }}>{act.text}</span>
                        <button className="btn-icon" style={{ padding: 4 }} onClick={() => removeActivity(di, ai)}>
                          <Icon name="trash" size={12} />
                        </button>
                      </div>
                    ))}
                    {newActivity.day === di ? (
                      <div className="flex gap-8 mt-8">
                        <input
                          className="form-input"
                          placeholder="Nova atividade..."
                          value={newActivity.text}
                          onChange={e => setNewActivity(a => ({ ...a, text: e.target.value }))}
                          onKeyDown={e => e.key === 'Enter' && addActivity(di)}
                          autoFocus
                        />
                        <button className="btn btn-primary btn-sm" onClick={() => addActivity(di)}>Adicionar</button>
                        <button className="btn btn-ghost btn-sm" onClick={() => setNewActivity({ day: null, text: '' })}>Cancelar</button>
                      </div>
                    ) : (
                      <button className="btn btn-ghost btn-sm mt-8" onClick={() => setNewActivity({ day: di, text: '' })}>
                        <Icon name="plus" size={14} /> Atividade
                      </button>
                    )}
                  </div>
                </div>
              );
            })
          )}
        </div>
      )}

      {/* Dicas */}
      {activeTab === 'dicas' && dest.cityTips && (
        <div>
          <div className="grid-2">
            {[
              ['💰 Moeda', dest.cityTips.currency],
              ['🚇 Transporte', dest.cityTips.transport],
              ['🌸 Melhor época', dest.cityTips.bestSeason],
              ['🗣️ Idioma', dest.cityTips.language],
              ['🔒 Segurança', dest.cityTips.safety],
              ['💳 Pagamento', dest.cityTips.payment],
            ].map(([label, val]) => val && (
              <div key={label} className="card-sm">
                <p className="text-sm text-muted mb-8">{label}</p>
                <p className="text-sm" style={{ lineHeight: 1.6 }}>{val}</p>
              </div>
            ))}
          </div>
        </div>
      )}
      {activeTab === 'dicas' && !dest.cityTips && (
        <div className="empty-state">
          <div className="emoji">💡</div>
          <h3>Nenhuma dica disponível</h3>
        </div>
      )}
    </div>
  );
}

// ─── Compare Page ─────────────────────────────────────────────────────────────
function ComparePage({ destinations }) {
  const [sel, setSel] = useState([null, null]);

  const dests = sel.map(id => destinations.find(d => d.id === id) || null);

  const totalCost = (dest) => dest ? (Number(dest.costs?.flight) || 0) + (Number(dest.costs?.hotel) || 0) + (Number(dest.costs?.other) || 0) : 0;
  const totalAttractions = (dest) => dest ? (dest.attractions || []).reduce((s, a) => s + (Number(a.price) || 0), 0) : 0;

  const totals = dests.map(d => d ? totalCost(d) + totalAttractions(d) : 0);
  const winnerIdx = totals[0] > 0 && totals[1] > 0 ? (totals[0] <= totals[1] ? 0 : 1) : -1;

  return (
    <div className="page">
      <div className="page-header">
        <h1 className="page-title">Comparativo</h1>
        <p className="page-subtitle">Compare custos entre dois destinos</p>
      </div>

      <div className="compare-row mb-24">
        {[0, 1].map(i => (
          <div key={i} className="compare-col">
            <div className={`compare-header ${winnerIdx === i ? 'compare-winner' : ''}`}>
              {winnerIdx === i && <div className="badge badge-accent mb-8">✈️ Mais em conta</div>}
              <span style={{ fontSize: 36, display: 'block', marginBottom: 8 }}>{dests[i]?.emoji || '🌍'}</span>
              <select
                className="form-input"
                style={{ textAlign: 'center', background: 'transparent' }}
                value={sel[i] || ''}
                onChange={e => setSel(s => { const n = [...s]; n[i] = e.target.value || null; return n; })}
              >
                <option value="">Selecionar destino...</option>
                {destinations.map(d => <option key={d.id} value={d.id}>{d.emoji} {d.name}</option>)}
              </select>
            </div>

            {dests[i] && (
              <div>
                {[
                  ['✈️ Passagem', dests[i].costs?.flight],
                  ['🏨 Hospedagem', dests[i].costs?.hotel],
                  ['💳 Outros', dests[i].costs?.other],
                ].map(([label, val]) => (
                  <div key={label} className="card-sm mb-8 flex justify-between items-center">
                    <span className="text-sm text-muted">{label}</span>
                    <span className="text-sm" style={{ fontWeight: 500 }}>{val ? fmtSimple(val) : '—'}</span>
                  </div>
                ))}

                <div className="section-divider text-xs">atrações</div>
                {(dests[i].attractions || []).slice(0, 5).map((a, j) => (
                  <div key={j} className="card-sm mb-8 flex justify-between items-center">
                    <span className="text-sm text-muted">{a.name}</span>
                    <div className="flex items-center gap-8">
                      <span className="text-sm" style={{ fontWeight: 500 }}>
                        {a.price ? `${a.price} ${a.currency}` : 'Gratuito'}
                      </span>
                      <Confidence level={a.priceConfidence} />
                    </div>
                  </div>
                ))}
                {(dests[i].attractions || []).length > 5 && (
                  <p className="text-xs text-muted" style={{ textAlign: 'center', padding: '8px 0' }}>
                    +{(dests[i].attractions || []).length - 5} mais atrações
                  </p>
                )}

                <div className="section-divider text-xs">total estimado</div>
                <div className={`compare-header ${winnerIdx === i ? 'compare-winner' : ''}`} style={{ marginTop: 0 }}>
                  <p className="text-sm text-muted mb-8">Total (passagem + hotel + outros)</p>
                  <p style={{ fontSize: 24, fontWeight: 600, color: 'var(--accent)' }}>{fmtSimple(totals[i])}</p>
                  {dests[i].dates?.from && dests[i].dates?.to && (() => {
                    const days = Math.ceil((new Date(dests[i].dates.to) - new Date(dests[i].dates.from)) / 86400000);
                    return days > 0 ? (
                      <p className="text-xs text-muted mt-8">{fmtSimple(totals[i] / days)} / dia · {days} dias</p>
                    ) : null;
                  })()}
                </div>
              </div>
            )}
          </div>
        ))}
      </div>

      {dests[0] && dests[1] && totals[0] > 0 && totals[1] > 0 && (
        <div className="card" style={{ textAlign: 'center' }}>
          <p className="text-muted text-sm">Diferença entre os destinos</p>
          <p style={{ fontSize: 28, fontWeight: 600, color: 'var(--accent)', margin: '8px 0' }}>
            {fmtSimple(Math.abs(totals[0] - totals[1]))}
          </p>
          <p className="text-sm text-muted">
            {dests[winnerIdx]?.name} é <strong style={{ color: 'var(--green)' }}>mais barato</strong> que {dests[winnerIdx === 0 ? 1 : 0]?.name}
          </p>
        </div>
      )}

      {destinations.length < 2 && (
        <div className="empty-state">
          <div className="emoji">⚖️</div>
          <h3>Você precisa de pelo menos 2 destinos</h3>
          <p>Adicione destinos na aba "Destinos" para comparar</p>
        </div>
      )}
    </div>
  );
}

// ─── Itinerary Page ───────────────────────────────────────────────────────────
function ItineraryPage({ destinations }) {
  const [selId, setSelId] = useState(null);
  const dest = destinations.find(d => d.id === selId);

  const today = new Date().toISOString().split('T')[0];
  const allActivities = dest ? (dest.itinerary || []).flatMap((day, di) =>
    (day.activities || []).map((a, ai) => ({ ...a, day, dayIdx: di, actIdx: ai, date: day.date }))
  ) : [];
  const todayActs = allActivities.filter(a => a.date === today);
  const doneCount = allActivities.filter(a => a.done).length;

  return (
    <div className="page">
      <div className="page-header flex justify-between items-center">
        <div>
          <h1 className="page-title">Modo viagem</h1>
          <p className="page-subtitle">Use durante a viagem para acompanhar seu roteiro</p>
        </div>
        <select
          className="form-input"
          style={{ width: 'auto' }}
          value={selId || ''}
          onChange={e => setSelId(e.target.value || null)}
        >
          <option value="">Selecionar destino...</option>
          {destinations.map(d => <option key={d.id} value={d.id}>{d.emoji} {d.name}</option>)}
        </select>
      </div>

      {!dest && (
        <div className="empty-state">
          <div className="emoji">🧳</div>
          <h3>Selecione um destino acima</h3>
        </div>
      )}

      {dest && (
        <>
          <div className="grid-3 mb-24">
            <div style={{ background: 'var(--bg2)', border: '1px solid var(--border)', borderRadius: 12, padding: '16px 20px' }}>
              <p className="text-xs text-muted mb-8">Destino atual</p>
              <p style={{ fontSize: 20, fontWeight: 600 }}>{dest.emoji} {dest.name}</p>
            </div>
            <div style={{ background: 'var(--bg2)', border: '1px solid var(--border)', borderRadius: 12, padding: '16px 20px' }}>
              <p className="text-xs text-muted mb-8">Atividades concluídas</p>
              <p style={{ fontSize: 20, fontWeight: 600 }}>{doneCount} <span className="text-muted" style={{ fontSize: 14 }}>/ {allActivities.length}</span></p>
            </div>
            <div style={{ background: 'var(--bg2)', border: '1px solid var(--border)', borderRadius: 12, padding: '16px 20px' }}>
              <p className="text-xs text-muted mb-8">Hoje</p>
              <p style={{ fontSize: 14, fontWeight: 500 }}>{new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' })}</p>
            </div>
          </div>

          {todayActs.length > 0 && (
            <div className="card mb-24" style={{ borderLeft: '3px solid var(--accent)', borderRadius: '0 12px 12px 0' }}>
              <p style={{ fontWeight: 500, marginBottom: 12 }}>📍 Atividades de hoje</p>
              {todayActs.map((a, i) => (
                <div key={i} className={`check-item ${a.done ? 'done' : ''}`}>
                  <span className="text-sm">{a.done ? '✅' : '⏳'}</span>
                  <span style={{ flex: 1, fontSize: 14 }}>{a.text}</span>
                </div>
              ))}
            </div>
          )}

          <div>
            {(dest.itinerary || []).map((day, di) => {
              const doneCnt = (day.activities || []).filter(a => a.done).length;
              const isToday = day.date === today;
              return (
                <div key={di} className="day-card" style={{ borderColor: isToday ? 'var(--accent-border)' : undefined }}>
                  <div className="day-header">
                    <div className="flex items-center gap-12">
                      <span className="day-number">Dia {di + 1}</span>
                      <span className="text-sm text-muted">
                        {new Date(day.date + 'T12:00:00').toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: 'short' })}
                      </span>
                      {isToday && <span className="badge badge-accent">Hoje</span>}
                    </div>
                    <span className="badge badge-green">{doneCnt}/{(day.activities || []).length}</span>
                  </div>
                  <div className="day-body">
                    {(day.activities || []).map((act, ai) => (
                      <div key={ai} className={`check-item ${act.done ? 'done' : ''}`}>
                        <div className="text-sm">{act.done ? '✅' : '⬜'}</div>
                        <span style={{ flex: 1, fontSize: 14 }}>{act.text}</span>
                      </div>
                    ))}
                    {(day.activities || []).length === 0 && <p className="text-sm text-muted">Nenhuma atividade</p>}
                  </div>
                </div>
              );
            })}
          </div>
        </>
      )}
    </div>
  );
}

// ─── App ──────────────────────────────────────────────────────────────────────
function App() {
  const [page, setPage] = useState('destinations');
  const [destinations, setDestinations] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showNewDest, setShowNewDest] = useState(false);
  const [selectedDest, setSelectedDest] = useState(null);
  const [toast, setToast] = useState(null);

  const showToast = (msg) => { setToast(msg); };

  useEffect(() => {
    loadDestinations().then(d => { setDestinations(d); setLoading(false); });
  }, []);

  const handleSaveDest = async (dest) => {
    const id = await saveDestination(dest);
    const newDest = { ...dest, id };
    setDestinations(prev => {
      const idx = prev.findIndex(d => d.id === id);
      if (idx >= 0) { const n = [...prev]; n[idx] = newDest; return n; }
      return [newDest, ...prev];
    });
    showToast('Destino salvo! ✈️');
  };

  const handleDeleteDest = async (id) => {
    await deleteDestination(id);
    setDestinations(prev => prev.filter(d => d.id !== id));
    showToast('Destino removido');
  };

  const navItems = [
    { id: 'destinations', label: 'Destinos', icon: 'plane' },
    { id: 'compare', label: 'Comparativo', icon: 'compare' },
    { id: 'itinerary', label: 'Modo viagem', icon: 'map' },
  ];

  return (
    <div className="app">
      <div className="sidebar">
        <div className="sidebar-logo">
          <h1>Viagens Lalu</h1>
          <p>Planejamento de viagens ✈️</p>
        </div>
        <nav className="sidebar-nav">
          {navItems.map(item => (
            <button
              key={item.id}
              className={`nav-item ${page === item.id && !selectedDest ? 'active' : ''}`}
              onClick={() => { setPage(item.id); setSelectedDest(null); }}
            >
              <Icon name={item.icon} />
              {item.label}
            </button>
          ))}
        </nav>
      </div>

      <main className="main">
        {loading ? (
          <div style={{ padding: 60, textAlign: 'center' }}>
            <div className="loader" style={{ justifyContent: 'center' }}>
              <div className="spinner" />
              <span>Carregando...</span>
            </div>
          </div>
        ) : selectedDest ? (
          <DestinationDetail
            dest={selectedDest}
            onUpdate={async (updated) => {
              await handleSaveDest(updated);
              setSelectedDest(updated);
            }}
            onBack={() => setSelectedDest(null)}
          />
        ) : page === 'destinations' ? (
          <DestinationsPage
            destinations={destinations}
            onAdd={() => setShowNewDest(true)}
            onSelect={setSelectedDest}
            onDelete={handleDeleteDest}
          />
        ) : page === 'compare' ? (
          <ComparePage destinations={destinations} />
        ) : (
          <ItineraryPage destinations={destinations} />
        )}
      </main>

      {showNewDest && (
        <NewDestinationModal
          onClose={() => setShowNewDest(false)}
          onSave={handleSaveDest}
        />
      )}

      {toast && <Toast message={toast} onClose={() => setToast(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
