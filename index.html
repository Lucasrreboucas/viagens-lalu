<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Viagens Lalu ✈️</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0e0f13; --bg2: #15161c; --bg3: #1c1d26; --bg4: #23242f;
    --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.12);
    --text: #f0f0f5; --text2: #9898aa; --text3: #5a5a70;
    --accent: #c9a96e; --accent2: #e8c88a; --accent-bg: rgba(201,169,110,0.1); --accent-border: rgba(201,169,110,0.3);
    --green: #4caf82; --green-bg: rgba(76,175,130,0.1);
    --red: #e05a5a; --red-bg: rgba(224,90,90,0.1);
    --blue: #5a9fe0; --blue-bg: rgba(90,159,224,0.1);
    --yellow: #e0c05a; --yellow-bg: rgba(224,192,90,0.1);
    --radius: 12px; --radius-sm: 8px; --shadow: 0 4px 24px rgba(0,0,0,0.4);
  }
  html, body, #root { height: 100%; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }
  button { font-family: 'DM Sans', sans-serif; cursor: pointer; }
  input, textarea, select { font-family: 'DM Sans', sans-serif; }
  ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: var(--bg); } ::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 3px; }
  .app { display: flex; height: 100vh; }
  .sidebar { width: 220px; min-width: 220px; background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px 0; }
  .sidebar-logo { padding: 0 16px 20px; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
  .sidebar-logo h1 { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--accent); }
  .sidebar-logo p { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .sidebar-nav { flex: 1; padding: 8px 10px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius-sm); color: var(--text2); font-size: 14px; cursor: pointer; transition: all 0.15s; margin-bottom: 2px; border: none; background: none; width: 100%; text-align: left; }
  .nav-item:hover { background: var(--bg3); color: var(--text); }
  .nav-item.active { background: var(--accent-bg); color: var(--accent); border: 1px solid var(--accent-border); }
  .nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }
  .main { flex: 1; overflow-y: auto; background: var(--bg); }
  .page { padding: 32px 36px; max-width: 1100px; }
  .page-header { margin-bottom: 28px; }
  .page-title { font-family: 'Playfair Display', serif; font-size: 30px; font-weight: 600; }
  .page-subtitle { font-size: 13px; color: var(--text2); margin-top: 4px; }
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
  .card-sm { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; border: none; transition: all 0.15s; cursor: pointer; }
  .btn-primary { background: var(--accent); color: #1a1200; }
  .btn-primary:hover { background: var(--accent2); }
  .btn-ghost { background: transparent; color: var(--text2); border: 1px solid var(--border2); }
  .btn-ghost:hover { background: var(--bg3); color: var(--text); }
  .btn-sm { padding: 6px 12px; font-size: 12px; }
  .btn-icon { padding: 7px; border-radius: var(--radius-sm); background: var(--bg3); border: 1px solid var(--border); color: var(--text2); transition: all 0.15s; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .btn-icon:hover { color: var(--text); border-color: var(--border2); }
  .form-group { margin-bottom: 14px; }
  .form-label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 5px; font-weight: 500; }
  .form-input { width: 100%; background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--radius-sm); padding: 9px 12px; color: var(--text); font-size: 14px; transition: border-color 0.15s; outline: none; }
  .form-input:focus { border-color: var(--accent); }
  .form-input::placeholder { color: var(--text3); }
  textarea.form-input { resize: vertical; min-height: 70px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; }
  .grid-auto { display: grid; grid-template-columns: repeat(auto-fill,minmax(280px,1fr)); gap: 18px; }
  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; }
  .badge-green { background: var(--green-bg); color: var(--green); }
  .badge-yellow { background: var(--yellow-bg); color: var(--yellow); }
  .badge-red { background: var(--red-bg); color: var(--red); }
  .badge-blue { background: var(--blue-bg); color: var(--blue); }
  .badge-accent { background: var(--accent-bg); color: var(--accent); }
  .dest-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; transition: all 0.2s; cursor: pointer; }
  .dest-card:hover { border-color: var(--border2); transform: translateY(-2px); box-shadow: var(--shadow); }
  .dest-card-banner { height: 90px; display: flex; align-items: center; justify-content: center; font-size: 44px; background: var(--bg3); }
  .dest-card-body { padding: 14px; }
  .dest-card-name { font-family: 'Playfair Display', serif; font-size: 17px; font-weight: 600; margin-bottom: 3px; }
  .dest-card-meta { font-size: 11px; color: var(--text3); margin-bottom: 10px; }
  .cost-pill { background: var(--bg3); border: 1px solid var(--border); border-radius: 20px; padding: 3px 9px; font-size: 11px; color: var(--text2); }
  .cost-pill span { color: var(--accent); font-weight: 500; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; backdrop-filter: blur(4px); }
  .modal { background: var(--bg2); border: 1px solid var(--border2); border-radius: var(--radius); width: 100%; max-width: 580px; max-height: 90vh; overflow-y: auto; }
  .modal-header { padding: 22px 22px 0; display: flex; justify-content: space-between; align-items: flex-start; }
  .modal-title { font-family: 'Playfair Display', serif; font-size: 20px; }
  .modal-body { padding: 18px 22px; }
  .modal-footer { padding: 0 22px 22px; display: flex; gap: 10px; justify-content: flex-end; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
  .tab { padding: 9px 14px; font-size: 13px; color: var(--text2); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; background: none; border-top: none; border-left: none; border-right: none; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .check-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .check-item:last-child { border-bottom: none; }
  .check-item.done .check-text { text-decoration: line-through; color: var(--text3); }
  .checkbox { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--border2); background: var(--bg3); flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; margin-top: 1px; }
  .checkbox.checked { background: var(--green); border-color: var(--green); }
  .confidence { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; }
  .conf-dot { width: 7px; height: 7px; border-radius: 50%; }
  .toast { position: fixed; bottom: 20px; right: 20px; background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--radius-sm); padding: 10px 16px; font-size: 13px; z-index: 9999; animation: slideIn 0.2s ease; box-shadow: var(--shadow); }
  @keyframes slideIn { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .empty-state { text-align: center; padding: 50px 20px; color: var(--text3); }
  .empty-state .emoji { font-size: 44px; margin-bottom: 14px; }
  .empty-state h3 { font-size: 17px; color: var(--text2); margin-bottom: 6px; }
  .divider { height: 1px; background: var(--border); margin: 16px 0; }
  .section-divider { display: flex; align-items: center; gap: 10px; margin: 16px 0; color: var(--text3); font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; }
  .section-divider::before, .section-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .compare-col { flex: 1; min-width: 0; }
  .compare-row { display: flex; gap: 14px; }
  .compare-header { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; text-align: center; margin-bottom: 14px; }
  .compare-winner { border-color: var(--accent-border); background: var(--accent-bg); }
  .day-card { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 14px; }
  .day-header { background: var(--bg3); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
  .day-number { font-family: 'Playfair Display', serif; font-size: 15px; color: var(--accent); }
  .day-body { padding: 14px 16px; }
  .city-tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; background: var(--bg3); border: 1px solid var(--border); border-radius: 20px; font-size: 13px; color: var(--text2); cursor: pointer; transition: all 0.15s; margin: 4px; }
  .city-tag:hover { border-color: var(--accent-border); color: var(--accent); }
  .flex { display: flex; } .items-center { align-items: center; } .justify-between { justify-content: space-between; }
  .gap-8 { gap: 8px; } .gap-12 { gap: 12px; }
  .mt-8 { margin-top: 8px; } .mt-12 { margin-top: 12px; } .mt-16 { margin-top: 16px; }
  .mb-8 { margin-bottom: 8px; } .mb-12 { margin-bottom: 12px; } .mb-14 { margin-bottom: 14px; } .mb-16 { margin-bottom: 16px; } .mb-20 { margin-bottom: 20px; }
  .text-sm { font-size: 13px; } .text-xs { font-size: 11px; } .text-muted { color: var(--text2); } .text-accent { color: var(--accent); }
  .w-full { width: 100%; }
  .spinner { width: 16px; height: 16px; border: 2px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="root"></div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyA4eJG_4N0eu6LXiGuReLzn1W14M0hvPLI",
  authDomain: "viagens-lalu.firebaseapp.com",
  projectId: "viagens-lalu",
  storageBucket: "viagens-lalu.firebasestorage.app",
  messagingSenderId: "402218450605",
  appId: "1:402218450605:web:d0f4f0012ddc0f54d19024"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
</script>
<script type="text/babel">
const { useState, useEffect } = React;

// ─── Icons ────────────────────────────────────────────────────────────────────
const Icon = ({ name, size = 16 }) => {
  const icons = {
    plane:    <svg width={size} height={size} fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>,
    compare:  <svg width={size} height={size} fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24"><rect x="2" y="3" width="9" height="18" rx="2"/><rect x="13" y="3" width="9" height="18" rx="2"/></svg>,
    map:      <svg width={size} height={size} fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24"><path d="M9 20L3 17V4l6 3m0 13l6-3m-6 3V7m6 10l6 3V7l-6-3m0 13V4"/></svg>,
    currency: <svg width={size} height={size} fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>,
    admin:    <svg width={size} height={size} fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>,
    plus:     <svg width={size} height={size} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>,
    x:        <svg width={size} height={size} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>,
    edit:     <svg width={size} height={size} fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,
    trash:    <svg width={size} height={size} fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>,
    check:    <svg width={size} height={size} fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>,
    lock:     <svg width={size} height={size} fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>,
    ticket:   <svg width={size} height={size} fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24"><path d="M2 9a3 3 0 010-6h20a3 3 0 010 6v6a3 3 0 010 6H2a3 3 0 010-6V9z"/></svg>,
  };
  return icons[name] || null;
};

// ─── Helpers ──────────────────────────────────────────────────────────────────
const fmt = v => v ? `R$ ${Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 0, maximumFractionDigits: 0 })}` : '—';

const fmtCurrency = (price, currency, rates) => {
  if (!price && price !== 0) return '—';
  if (price === 0) return 'Gratuito';
  if (!currency || currency === 'BRL') return fmt(price);
  const rate = rates?.[currency];
  if (rate) return `${price} ${currency} ≈ ${fmt(price * rate)}`;
  return `${price} ${currency}`;
};

const CONFIDENCE_MAP = {
  high:   { color: '#4caf82', label: 'Confirmado' },
  medium: { color: '#e0c05a', label: 'Estimado' },
  low:    { color: '#e05a5a', label: 'Incerto' },
};

function Confidence({ level }) {
  const c = CONFIDENCE_MAP[level] || CONFIDENCE_MAP.medium;
  return (
    <span className="confidence" style={{ color: c.color }}>
      <span className="conf-dot" style={{ background: c.color }} />
      {c.label}
    </span>
  );
}

function Toast({ message, onClose }) {
  useEffect(() => { const t = setTimeout(onClose, 3000); return () => clearTimeout(t); }, []);
  return <div className="toast">{message}</div>;
}

// ─── Firebase ─────────────────────────────────────────────────────────────────
const loadDestinations = async () => {
  const snap = await db.collection('destinations').orderBy('createdAt', 'desc').get();
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
};
const saveDestination = async dest => {
  if (dest.id) { await db.collection('destinations').doc(dest.id).set(dest, { merge: true }); return dest.id; }
  const ref = await db.collection('destinations').add({ ...dest, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
  return ref.id;
};
const deleteDestination = async id => db.collection('destinations').doc(id).delete();
const loadRates = async () => { const s = await db.collection('config').doc('rates').get(); return s.exists ? s.data() : {}; };
const saveRates = async r => db.collection('config').doc('rates').set(r);
const loadCityDB = async () => { const s = await db.collection('config').doc('citydb').get(); return s.exists ? s.data().cities || [] : []; };
const saveCityDB = async cities => db.collection('config').doc('citydb').set({ cities });

// ─── New Destination Modal ────────────────────────────────────────────────────
function NewDestinationModal({ onClose, onSave, cityDB }) {
  const [step, setStep] = useState('search');
  const [query, setQuery] = useState('');
  const [selected, setSelected] = useState(null);
  const [dates, setDates] = useState({ from: '', to: '' });
  const [costs, setCosts] = useState({ flight: '', hotel: '', other: '' });

  const results = query.length > 1
    ? cityDB.filter(c => c.name.toLowerCase().includes(query.toLowerCase()) || c.country.toLowerCase().includes(query.toLowerCase()))
    : cityDB.slice(0, 16);

  const handleSelect = city => { setSelected(city); setQuery(city.name); setStep('details'); };
  const handleManual = () => {
    setSelected({ name: query, country: '', emoji: '🌍', currency: 'EUR', attractions: [], touristPass: { exists: false }, cityTips: null });
    setStep('details');
  };
  const handleSave = async () => {
    await onSave({ name: selected.name, country: selected.country, emoji: selected.emoji, currency: selected.currency, dates, costs, attractions: selected.attractions || [], touristPass: selected.touristPass || null, cityTips: selected.cityTips || null, itinerary: [] });
    onClose();
  };

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <div className="modal-header">
          <h2 className="modal-title">Adicionar destino</h2>
          <button className="btn-icon" onClick={onClose}><Icon name="x" /></button>
        </div>
        <div className="modal-body">
          {step === 'search' && (
            <>
              <div className="form-group">
                <label className="form-label">Buscar cidade</label>
                <input className="form-input" placeholder="Ex: Roma, Paris, Tóquio..." value={query} onChange={e => { setQuery(e.target.value); setStep('search'); }} autoFocus />
              </div>
              <div style={{ display: 'flex', flexWrap: 'wrap', maxHeight: 260, overflowY: 'auto' }}>
                {results.map(c => (
                  <span key={c.id} className="city-tag" onClick={() => handleSelect(c)}>{c.emoji} {c.name}</span>
                ))}
              </div>
              {query.length > 1 && results.length === 0 && (
                <div style={{ marginTop: 12 }}>
                  <p className="text-sm text-muted mb-8">Cidade não encontrada no banco.</p>
                  <button className="btn btn-ghost btn-sm" onClick={handleManual}><Icon name="plus" /> Adicionar "{query}" manualmente</button>
                </div>
              )}
            </>
          )}

          {step === 'details' && selected && (
            <>
              <div className="flex items-center gap-12 mb-16">
                <span style={{ fontSize: 36 }}>{selected.emoji}</span>
                <div>
                  <p style={{ fontWeight: 600, fontSize: 16 }}>{selected.name}</p>
                  <p className="text-xs text-muted">{selected.country} · {selected.attractions?.length || 0} atrações</p>
                </div>
                <button className="btn btn-ghost btn-sm" style={{ marginLeft: 'auto' }} onClick={() => setStep('search')}>Trocar</button>
              </div>
              {selected.touristPass?.exists && (
                <div className="card-sm mb-12" style={{ borderLeft: '2px solid var(--accent)' }}>
                  <div className="flex items-center gap-8">
                    <Icon name="ticket" />
                    <span className="text-sm" style={{ fontWeight: 500 }}>{selected.touristPass.name}</span>
                  </div>
                  <p className="text-xs text-muted mt-8">⚠️ {selected.touristPass.activationNote}</p>
                </div>
              )}
              <div className="grid-2">
                <div className="form-group">
                  <label className="form-label">Data de ida</label>
                  <input type="date" className="form-input" value={dates.from} onChange={e => setDates(d => ({ ...d, from: e.target.value }))} />
                </div>
                <div className="form-group">
                  <label className="form-label">Data de volta</label>
                  <input type="date" className="form-input" value={dates.to} onChange={e => setDates(d => ({ ...d, to: e.target.value }))} />
                </div>
              </div>
              <div className="section-divider">custos estimados (R$)</div>
              <div className="grid-3">
                {[['✈️ Passagem', 'flight'], ['🏨 Hospedagem', 'hotel'], ['💳 Outros', 'other']].map(([label, key]) => (
                  <div key={key} className="form-group" style={{ marginBottom: 0 }}>
                    <label className="form-label">{label}</label>
                    <input type="number" className="form-input" placeholder="0" value={costs[key]} onChange={e => setCosts(c => ({ ...c, [key]: e.target.value }))} />
                  </div>
                ))}
              </div>
            </>
          )}
        </div>
        <div className="modal-footer">
          <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
          {step === 'details' && <button className="btn btn-primary" onClick={handleSave}>Salvar destino</button>}
        </div>
      </div>
    </div>
  );
}

// ─── Destinations Page ────────────────────────────────────────────────────────
function DestinationsPage({ destinations, onAdd, onSelect, onDelete }) {
  return (
    <div className="page">
      <div className="page-header flex justify-between items-center">
        <div>
          <h1 className="page-title">Destinos</h1>
          <p className="page-subtitle">Seus destinos planejados</p>
        </div>
        <button className="btn btn-primary" onClick={onAdd}><Icon name="plus" /> Novo destino</button>
      </div>
      {destinations.length === 0 ? (
        <div className="empty-state"><div className="emoji">🗺️</div><h3>Nenhum destino ainda</h3><p>Clique em "Novo destino" para começar</p></div>
      ) : (
        <div className="grid-auto">
          {destinations.map(dest => {
            const total = (Number(dest.costs?.flight)||0) + (Number(dest.costs?.hotel)||0) + (Number(dest.costs?.other)||0);
            const days = dest.dates?.from && dest.dates?.to ? Math.ceil((new Date(dest.dates.to) - new Date(dest.dates.from)) / 86400000) : null;
            return (
              <div key={dest.id} className="dest-card" onClick={() => onSelect(dest)}>
                <div className="dest-card-banner">{dest.emoji}</div>
                <div className="dest-card-body">
                  <div className="flex justify-between items-center">
                    <h3 className="dest-card-name">{dest.name}</h3>
                    <button className="btn-icon" style={{ padding: 5 }} onClick={e => { e.stopPropagation(); onDelete(dest.id); }}>
                      <Icon name="trash" size={13} />
                    </button>
                  </div>
                  <p className="dest-card-meta">
                    {dest.country && `${dest.country} · `}
                    {dest.dates?.from && new Date(dest.dates.from + 'T12:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' })}
                    {dest.dates?.to && ` → ${new Date(dest.dates.to + 'T12:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: 'numeric' })}`}
                    {days && ` · ${days}d`}
                  </p>
                  <div className="flex gap-8" style={{ flexWrap: 'wrap', marginBottom: 8 }}>
                    {dest.costs?.flight && <span className="cost-pill">✈️ <span>{fmt(dest.costs.flight)}</span></span>}
                    {dest.costs?.hotel && <span className="cost-pill">🏨 <span>{fmt(dest.costs.hotel)}</span></span>}
                    {total > 0 && <span className="cost-pill">Total <span>{fmt(total)}</span></span>}
                  </div>
                  {dest.touristPass?.exists && <span className="badge badge-accent"><Icon name="ticket" size={10} /> Tourist Pass</span>}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ─── Destination Detail ───────────────────────────────────────────────────────
function DestinationDetail({ dest, onUpdate, onBack, rates }) {
  const [activeTab, setActiveTab] = useState('atrações');
  const [editingAttr, setEditingAttr] = useState(null);
  const [editVal, setEditVal] = useState('');
  const [editCosts, setEditCosts] = useState(dest.costs || {});
  const [editingCosts, setEditingCosts] = useState(false);
  const [newDay, setNewDay] = useState('');
  const [newActivity, setNewActivity] = useState({ day: null, text: '' });
  const [newAttr, setNewAttr] = useState(false);
  const [attrForm, setAttrForm] = useState({ name: '', price: '', currency: dest.currency || 'EUR', category: '', description: '', tip: '', confidence: 'medium' });

  const saveCosts = async () => { await onUpdate({ ...dest, costs: editCosts }); setEditingCosts(false); };

  const saveAttrPrice = async (idx, val) => {
    const updated = [...dest.attractions];
    updated[idx] = { ...updated[idx], price: parseFloat(val) || 0, confidence: 'medium' };
    await onUpdate({ ...dest, attractions: updated });
    setEditingAttr(null);
  };

  const addAttr = async () => {
    const updated = [...(dest.attractions || []), { ...attrForm, price: parseFloat(attrForm.price) || 0 }];
    await onUpdate({ ...dest, attractions: updated });
    setNewAttr(false);
    setAttrForm({ name: '', price: '', currency: dest.currency || 'EUR', category: '', description: '', tip: '', confidence: 'medium' });
  };

  const removeAttr = async idx => {
    const updated = [...dest.attractions]; updated.splice(idx, 1);
    await onUpdate({ ...dest, attractions: updated });
  };

  const addDay = async () => {
    if (!newDay.trim()) return;
    const itinerary = [...(dest.itinerary || []), { date: newDay, activities: [] }];
    itinerary.sort((a, b) => a.date.localeCompare(b.date));
    await onUpdate({ ...dest, itinerary });
    setNewDay('');
  };

  const addActivity = async dayIdx => {
    if (!newActivity.text.trim()) return;
    const itinerary = JSON.parse(JSON.stringify(dest.itinerary || []));
    itinerary[dayIdx].activities = [...(itinerary[dayIdx].activities || []), { text: newActivity.text, done: false }];
    await onUpdate({ ...dest, itinerary });
    setNewActivity({ day: null, text: '' });
  };

  const toggleActivity = async (dayIdx, actIdx) => {
    const itinerary = JSON.parse(JSON.stringify(dest.itinerary || []));
    itinerary[dayIdx].activities[actIdx].done = !itinerary[dayIdx].activities[actIdx].done;
    await onUpdate({ ...dest, itinerary });
  };

  const removeActivity = async (dayIdx, actIdx) => {
    const itinerary = JSON.parse(JSON.stringify(dest.itinerary || []));
    itinerary[dayIdx].activities.splice(actIdx, 1);
    await onUpdate({ ...dest, itinerary });
  };

  const removeDay = async dayIdx => {
    const itinerary = JSON.parse(JSON.stringify(dest.itinerary || []));
    itinerary.splice(dayIdx, 1);
    await onUpdate({ ...dest, itinerary });
  };

  const days = dest.dates?.from && dest.dates?.to ? Math.ceil((new Date(dest.dates.to) - new Date(dest.dates.from)) / 86400000) : null;
  const total = (Number(dest.costs?.flight)||0) + (Number(dest.costs?.hotel)||0) + (Number(dest.costs?.other)||0);

  return (
    <div className="page">
      <button className="btn btn-ghost btn-sm mb-16" onClick={onBack}>← Voltar</button>
      <div className="page-header flex items-center gap-12">
        <span style={{ fontSize: 44 }}>{dest.emoji}</span>
        <div>
          <h1 className="page-title">{dest.name}</h1>
          <p className="page-subtitle">
            {dest.country && `${dest.country} · `}
            {dest.dates?.from && new Date(dest.dates.from + 'T12:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' })}
            {dest.dates?.to && ` → ${new Date(dest.dates.to + 'T12:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' })}`}
            {days && ` · ${days} dias`}
          </p>
        </div>
      </div>

      {/* Custos */}
      <div className="card mb-20">
        <div className="flex justify-between items-center mb-14">
          <span style={{ fontWeight: 500 }}>Custos</span>
          {!editingCosts
            ? <button className="btn btn-ghost btn-sm" onClick={() => setEditingCosts(true)}><Icon name="edit" size={13} /> Editar</button>
            : <button className="btn btn-primary btn-sm" onClick={saveCosts}><Icon name="check" size={13} /> Salvar</button>}
        </div>
        {editingCosts ? (
          <div className="grid-3">
            {[['✈️ Passagem (R$)', 'flight'], ['🏨 Hospedagem (R$)', 'hotel'], ['💳 Outros (R$)', 'other']].map(([label, key]) => (
              <div key={key} className="form-group" style={{ marginBottom: 0 }}>
                <label className="form-label">{label}</label>
                <input type="number" className="form-input" value={editCosts[key] || ''} onChange={e => setEditCosts(c => ({ ...c, [key]: e.target.value }))} />
              </div>
            ))}
          </div>
        ) : (
          <div className="grid-3">
            {[['✈️ Passagem', dest.costs?.flight], ['🏨 Hospedagem', dest.costs?.hotel], ['💳 Outros', dest.costs?.other]].map(([label, val]) => (
              <div key={label} style={{ background: 'var(--bg3)', borderRadius: 8, padding: '10px 14px' }}>
                <p className="text-xs text-muted mb-8">{label}</p>
                <p style={{ fontSize: 17, fontWeight: 500, color: val ? 'var(--accent)' : 'var(--text3)' }}>{val ? fmt(val) : '—'}</p>
              </div>
            ))}
          </div>
        )}
        {total > 0 && <div style={{ textAlign: 'right', color: 'var(--text2)', fontSize: 13, marginTop: 12 }}>Total: <span style={{ color: 'var(--accent)', fontWeight: 600, fontSize: 17 }}>{fmt(total)}</span></div>}
      </div>

      <div className="tabs">
        {['atrações', 'roteiro', 'dicas', 'esportes'].map(t => (
          <button key={t} className={`tab ${activeTab === t ? 'active' : ''}`} onClick={() => setActiveTab(t)}>
            {t === 'esportes' && (dest.sportingEvents||[]).length > 0 ? `🏟️ Esportes (${(dest.sportingEvents||[]).length})` : t.charAt(0).toUpperCase() + t.slice(1)}
          </button>
        ))}
      </div>

      {/* Tab: Atrações */}
      {activeTab === 'atrações' && (
        <div>
          {dest.touristPass?.exists && (
            <div className="card-sm mb-14" style={{ borderLeft: '2px solid var(--accent)' }}>
              <div className="flex items-center gap-8 mb-6">
                <Icon name="ticket" />
                <span style={{ fontWeight: 500, fontSize: 14 }}>{dest.touristPass.name}</span>
                <span className="badge badge-accent">{fmtCurrency(dest.touristPass.price, dest.touristPass.currency || dest.currency, rates)}</span>
              </div>
              <p className="text-xs text-muted">⚠️ {dest.touristPass.activationNote}</p>
              {dest.touristPass.includes?.length > 0 && <p className="text-xs text-muted mt-8">Inclui: {dest.touristPass.includes.join(', ')}</p>}
              {dest.touristPass.buyLink && <a href={dest.touristPass.buyLink} target="_blank" rel="noreferrer" className="text-xs text-accent" style={{ marginTop: 6, display: 'block' }}>🔗 Comprar online</a>}
            </div>
          )}

          <div style={{ display: 'flex', flexDirection: 'column', gap: 8, marginBottom: 12 }}>
            {(dest.attractions || []).map((attr, i) => (
              <div key={i} className="card-sm" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 12 }}>
                <div style={{ flex: 1 }}>
                  <div className="flex items-center gap-8 mb-4">
                    <span style={{ fontWeight: 500, fontSize: 13 }}>{attr.name}</span>
                    {attr.category && <span className="badge badge-blue" style={{ fontSize: 10 }}>{attr.category}</span>}
                  </div>
                  {attr.description && <p className="text-xs text-muted">{attr.description}</p>}
                  {attr.tip && <p className="text-xs mt-8" style={{ color: 'var(--accent)' }}>💡 {attr.tip}</p>}
                </div>
                <div style={{ textAlign: 'right', flexShrink: 0 }}>
                  {editingAttr === i ? (
                    <div className="flex items-center gap-8">
                      <input type="number" className="form-input" style={{ width: 80 }} value={editVal} onChange={e => setEditVal(e.target.value)} autoFocus />
                      <button className="btn-icon" onClick={() => saveAttrPrice(i, editVal)}><Icon name="check" size={13} /></button>
                      <button className="btn-icon" onClick={() => setEditingAttr(null)}><Icon name="x" size={13} /></button>
                    </div>
                  ) : (
                    <div className="flex items-center gap-8">
                      <div>
                        <p style={{ fontWeight: 500, color: 'var(--accent)', fontSize: 13 }}>{fmtCurrency(attr.price, attr.currency || dest.currency, rates)}</p>
                        <Confidence level={attr.confidence} />
                      </div>
                      <div className="flex gap-4">
                        <button className="btn-icon" style={{ padding: 5 }} onClick={() => { setEditingAttr(i); setEditVal(attr.price || ''); }}><Icon name="edit" size={12} /></button>
                        <button className="btn-icon" style={{ padding: 5 }} onClick={() => removeAttr(i)}><Icon name="trash" size={12} /></button>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            ))}
          </div>

          {newAttr ? (
            <div className="card-sm">
              <p className="text-sm" style={{ fontWeight: 500, marginBottom: 12 }}>Nova atração</p>
              <div className="grid-2 mb-8">
                <div className="form-group" style={{ marginBottom: 0 }}><label className="form-label">Nome</label><input className="form-input" value={attrForm.name} onChange={e => setAttrForm(f => ({ ...f, name: e.target.value }))} autoFocus /></div>
                <div className="form-group" style={{ marginBottom: 0 }}><label className="form-label">Categoria</label><input className="form-input" placeholder="museu, templo..." value={attrForm.category} onChange={e => setAttrForm(f => ({ ...f, category: e.target.value }))} /></div>
              </div>
              <div className="grid-3 mb-8">
                <div className="form-group" style={{ marginBottom: 0 }}><label className="form-label">Preço</label><input type="number" className="form-input" value={attrForm.price} onChange={e => setAttrForm(f => ({ ...f, price: e.target.value }))} /></div>
                <div className="form-group" style={{ marginBottom: 0 }}><label className="form-label">Moeda</label><input className="form-input" value={attrForm.currency} onChange={e => setAttrForm(f => ({ ...f, currency: e.target.value }))} /></div>
                <div className="form-group" style={{ marginBottom: 0 }}>
                  <label className="form-label">Confiabilidade</label>
                  <select className="form-input" value={attrForm.confidence} onChange={e => setAttrForm(f => ({ ...f, confidence: e.target.value }))}>
                    <option value="high">🟢 Confirmado</option>
                    <option value="medium">🟡 Estimado</option>
                    <option value="low">🔴 Incerto</option>
                  </select>
                </div>
              </div>
              <div className="form-group mb-8"><label className="form-label">Descrição</label><input className="form-input" value={attrForm.description} onChange={e => setAttrForm(f => ({ ...f, description: e.target.value }))} /></div>
              <div className="form-group" style={{ marginBottom: 0 }}><label className="form-label">Dica</label><input className="form-input" value={attrForm.tip} onChange={e => setAttrForm(f => ({ ...f, tip: e.target.value }))} /></div>
              <div className="flex gap-8 mt-12">
                <button className="btn btn-primary btn-sm" onClick={addAttr}>Salvar</button>
                <button className="btn btn-ghost btn-sm" onClick={() => setNewAttr(false)}>Cancelar</button>
              </div>
            </div>
          ) : (
            <button className="btn btn-ghost btn-sm" onClick={() => setNewAttr(true)}><Icon name="plus" /> Adicionar atração</button>
          )}
        </div>
      )}

      {/* Tab: Roteiro */}
      {activeTab === 'roteiro' && (
        <div>
          <div className="flex gap-8 mb-14">
            <input type="date" className="form-input" style={{ width: 'auto', flex: 1 }} value={newDay} onChange={e => setNewDay(e.target.value)} />
            <button className="btn btn-primary" onClick={addDay}><Icon name="plus" /> Adicionar dia</button>
          </div>
          {(dest.itinerary || []).length === 0 ? (
            <div className="empty-state"><div className="emoji">📅</div><h3>Nenhum dia no roteiro</h3></div>
          ) : (
            (dest.itinerary || []).map((day, di) => {
              const done = (day.activities || []).filter(a => a.done).length;
              return (
                <div key={di} className="day-card">
                  <div className="day-header">
                    <div>
                      <span className="day-number">Dia {di + 1}</span>
                      <span className="text-sm text-muted" style={{ marginLeft: 10 }}>
                        {new Date(day.date + 'T12:00:00').toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' })}
                      </span>
                    </div>
                    <div className="flex items-center gap-8">
                      {(day.activities || []).length > 0 && <span className="badge badge-green">{done}/{(day.activities || []).length}</span>}
                      <button className="btn-icon" style={{ padding: 5 }} onClick={() => removeDay(di)}><Icon name="trash" size={12} /></button>
                    </div>
                  </div>
                  <div className="day-body">
                    {(day.activities || []).map((act, ai) => (
                      <div key={ai} className={`check-item ${act.done ? 'done' : ''}`}>
                        <div className={`checkbox ${act.done ? 'checked' : ''}`} onClick={() => toggleActivity(di, ai)}>
                          {act.done && <Icon name="check" size={10} />}
                        </div>
                        <span className="check-text" style={{ flex: 1, fontSize: 13 }}>{act.text}</span>
                        <button className="btn-icon" style={{ padding: 4 }} onClick={() => removeActivity(di, ai)}><Icon name="trash" size={11} /></button>
                      </div>
                    ))}
                    {newActivity.day === di ? (
                      <div className="flex gap-8 mt-8">
                        <input className="form-input" placeholder="Nova atividade..." value={newActivity.text} onChange={e => setNewActivity(a => ({ ...a, text: e.target.value }))} onKeyDown={e => e.key === 'Enter' && addActivity(di)} autoFocus />
                        <button className="btn btn-primary btn-sm" onClick={() => addActivity(di)}>OK</button>
                        <button className="btn btn-ghost btn-sm" onClick={() => setNewActivity({ day: null, text: '' })}>✕</button>
                      </div>
                    ) : (
                      <button className="btn btn-ghost btn-sm mt-8" onClick={() => setNewActivity({ day: di, text: '' })}><Icon name="plus" size={13} /> Atividade</button>
                    )}
                  </div>
                </div>
              );
            })
          )}
        </div>
      )}

      {/* Tab: Esportes */}
      {activeTab === 'esportes' && (
        (dest.sportingEvents || []).length === 0 ? (
          <div className="empty-state"><div className="emoji">🏟️</div><h3>Nenhum evento esportivo mapeado</h3><p>Esta cidade não tem eventos tênis/futebol/esporte relevantes no radar</p></div>
        ) : (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
            {(dest.sportingEvents || []).map((ev, i) => {
              const confColors = { confirmed_2026: 'var(--green)', confirmed_2027: 'var(--green)', confirmed_2027_final: 'var(--accent)', estimated: 'var(--yellow)' };
              const confLabels = { confirmed_2026: '✅ Confirmado 2026', confirmed_2027: '✅ Confirmado 2027', confirmed_2027_final: '🏆 Confirmado 2027', estimated: '📅 Estimado' };
              const sportIcons = { 'tênis': '🎾', 'futebol': '⚽', 'basquete': '🏀', 'beisebol': '⚾', 'rugby': '🏉', 'rugby league': '🏉', 'automobilismo': '🏎️', 'MMA': '🥊' };
              return (
                <div key={i} className="card-sm">
                  <div className="flex justify-between items-center mb-8">
                    <div className="flex items-center gap-8">
                      <span style={{ fontSize: 20 }}>{sportIcons[ev.sport] || '🏟️'}</span>
                      <div>
                        <p style={{ fontWeight: 600, fontSize: 14 }}>{ev.name}</p>
                        <span className="badge badge-blue" style={{ fontSize: 10 }}>{ev.type}</span>
                      </div>
                    </div>
                    <span style={{ fontSize: 11, color: confColors[ev.confidence] || 'var(--text3)', fontWeight: 500 }}>
                      {confLabels[ev.confidence] || ev.confidence}
                    </span>
                  </div>
                  <div className="grid-2 mt-8" style={{ gap: 8 }}>
                    <div className="card-sm" style={{ padding: '8px 12px', background: 'var(--bg4)' }}>
                      <p className="text-xs text-muted mb-4">📍 Local</p>
                      <p className="text-xs">{ev.venue}</p>
                    </div>
                    <div className="card-sm" style={{ padding: '8px 12px', background: 'var(--bg4)' }}>
                      <p className="text-xs text-muted mb-4">💰 Ingresso aprox.</p>
                      <p className="text-xs" style={{ color: 'var(--accent)', fontWeight: 500 }}>{ev.ticket_price_approx || '—'}</p>
                    </div>
                  </div>
                  {(ev.dates_2026 || ev.dates_2027) && (
                    <div className="grid-2 mt-8" style={{ gap: 8 }}>
                      {ev.dates_2026 && ev.dates_2026 !== 'N/A' && (
                        <div className="card-sm" style={{ padding: '8px 12px', background: 'var(--bg4)' }}>
                          <p className="text-xs text-muted mb-4">🗓 2026</p>
                          <p className="text-xs">{ev.dates_2026}</p>
                        </div>
                      )}
                      {ev.dates_2027 && ev.dates_2027 !== 'N/A' && (
                        <div className="card-sm" style={{ padding: '8px 12px', background: 'var(--bg4)' }}>
                          <p className="text-xs text-muted mb-4">🗓 2027</p>
                          <p className="text-xs">{ev.dates_2027}</p>
                        </div>
                      )}
                    </div>
                  )}
                  {ev.ticket_tip && (
                    <p className="text-xs mt-8" style={{ color: 'var(--accent)', lineHeight: 1.5 }}>💡 {ev.ticket_tip}</p>
                  )}
                  {ev.notes && (
                    <p className="text-xs mt-6 text-muted" style={{ lineHeight: 1.5 }}>{ev.notes}</p>
                  )}
                  {ev.buy_link && (
                    <a href={ev.buy_link} target="_blank" rel="noreferrer" className="text-xs text-accent mt-8" style={{ display: 'inline-block' }}>🔗 Comprar ingresso</a>
                  )}
                </div>
              );
            })}
          </div>
        )
      )}

      {/* Tab: Dicas */}
      {activeTab === 'dicas' && (
        dest.cityTips ? (
          <div className="grid-2">
            {[['💰 Moeda / câmbio', dest.cityTips.currency], ['🚇 Transporte', dest.cityTips.transport], ['🌸 Melhor época', dest.cityTips.bestSeason], ['🗣️ Idioma', dest.cityTips.language], ['🔒 Segurança', dest.cityTips.safety], ['💳 Pagamento', dest.cityTips.payment], ['🍽️ Gastronomia', dest.cityTips.food]].map(([label, val]) => val && (
              <div key={label} className="card-sm">
                <p className="text-xs text-muted mb-6">{label}</p>
                <p className="text-sm" style={{ lineHeight: 1.6 }}>{val}</p>
              </div>
            ))}
          </div>
        ) : <div className="empty-state"><div className="emoji">💡</div><h3>Nenhuma dica disponível</h3></div>
      )}
    </div>
  );
}

// ─── Compare Page ─────────────────────────────────────────────────────────────
function ComparePage({ destinations, rates }) {
  const [sel, setSel] = useState([null, null]);
  const dests = sel.map(id => destinations.find(d => d.id === id) || null);
  const totalCost = d => d ? (Number(d.costs?.flight)||0) + (Number(d.costs?.hotel)||0) + (Number(d.costs?.other)||0) : 0;
  const totals = dests.map(d => totalCost(d));
  const winnerIdx = totals[0] > 0 && totals[1] > 0 ? (totals[0] <= totals[1] ? 0 : 1) : -1;

  return (
    <div className="page">
      <div className="page-header">
        <h1 className="page-title">Comparativo</h1>
        <p className="page-subtitle">Compare custos entre dois destinos</p>
      </div>
      {destinations.length < 2 ? (
        <div className="empty-state"><div className="emoji">⚖️</div><h3>Você precisa de pelo menos 2 destinos</h3></div>
      ) : (
        <>
          <div className="compare-row mb-20">
            {[0, 1].map(i => (
              <div key={i} className="compare-col">
                <div className={`compare-header ${winnerIdx === i ? 'compare-winner' : ''}`}>
                  {winnerIdx === i && <div className="badge badge-accent mb-8">✈️ Mais em conta</div>}
                  <span style={{ fontSize: 32, display: 'block', marginBottom: 8 }}>{dests[i]?.emoji || '🌍'}</span>
                  <select className="form-input" style={{ textAlign: 'center', background: 'transparent' }} value={sel[i] || ''} onChange={e => { const n = [...sel]; n[i] = e.target.value || null; setSel(n); }}>
                    <option value="">Selecionar...</option>
                    {destinations.map(d => <option key={d.id} value={d.id}>{d.emoji} {d.name}</option>)}
                  </select>
                </div>
                {dests[i] && (
                  <div>
                    {[['✈️ Passagem', dests[i].costs?.flight], ['🏨 Hospedagem', dests[i].costs?.hotel], ['💳 Outros', dests[i].costs?.other]].map(([label, val]) => (
                      <div key={label} className="card-sm mb-8 flex justify-between items-center">
                        <span className="text-sm text-muted">{label}</span>
                        <span className="text-sm" style={{ fontWeight: 500 }}>{val ? fmt(val) : '—'}</span>
                      </div>
                    ))}
                    <div className="section-divider">atrações principais</div>
                    {(dests[i].attractions || []).slice(0, 5).map((a, j) => (
                      <div key={j} className="card-sm mb-6 flex justify-between items-center">
                        <span className="text-xs text-muted" style={{ flex: 1 }}>{a.name}</span>
                        <div className="flex items-center gap-6">
                          <span className="text-xs" style={{ fontWeight: 500 }}>{fmtCurrency(a.price, a.currency || dests[i].currency, rates)}</span>
                          <Confidence level={a.confidence} />
                        </div>
                      </div>
                    ))}
                    <div className="section-divider">total</div>
                    <div className={`compare-header ${winnerIdx === i ? 'compare-winner' : ''}`} style={{ marginTop: 0 }}>
                      <p className="text-xs text-muted mb-6">Passagem + hospedagem + outros</p>
                      <p style={{ fontSize: 22, fontWeight: 600, color: 'var(--accent)' }}>{fmt(totals[i])}</p>
                      {dests[i].dates?.from && dests[i].dates?.to && (() => {
                        const d = Math.ceil((new Date(dests[i].dates.to) - new Date(dests[i].dates.from)) / 86400000);
                        return d > 0 ? <p className="text-xs text-muted mt-6">{fmt(totals[i] / d)}/dia · {d} dias</p> : null;
                      })()}
                    </div>
                  </div>
                )}
              </div>
            ))}
          </div>
          {dests[0] && dests[1] && totals[0] > 0 && totals[1] > 0 && (
            <div className="card" style={{ textAlign: 'center' }}>
              <p className="text-muted text-sm">Diferença entre os destinos</p>
              <p style={{ fontSize: 26, fontWeight: 600, color: 'var(--accent)', margin: '6px 0' }}>{fmt(Math.abs(totals[0] - totals[1]))}</p>
              <p className="text-sm text-muted">{dests[winnerIdx]?.name} é <strong style={{ color: 'var(--green)' }}>mais barato</strong> que {dests[winnerIdx === 0 ? 1 : 0]?.name}</p>
            </div>
          )}
        </>
      )}
    </div>
  );
}

// ─── Itinerary / Modo Viagem ──────────────────────────────────────────────────
function ItineraryPage({ destinations }) {
  const [selId, setSelId] = useState(null);
  const dest = destinations.find(d => d.id === selId);
  const today = new Date().toISOString().split('T')[0];
  const allActs = dest ? (dest.itinerary || []).flatMap((day, di) => (day.activities || []).map((a, ai) => ({ ...a, date: day.date, dayIdx: di, actIdx: ai }))) : [];
  const todayActs = allActs.filter(a => a.date === today);
  const doneCount = allActs.filter(a => a.done).length;

  return (
    <div className="page">
      <div className="page-header flex justify-between items-center">
        <div><h1 className="page-title">Modo viagem</h1><p className="page-subtitle">Acompanhe seu roteiro durante a viagem</p></div>
        <select className="form-input" style={{ width: 'auto' }} value={selId || ''} onChange={e => setSelId(e.target.value || null)}>
          <option value="">Selecionar destino...</option>
          {destinations.map(d => <option key={d.id} value={d.id}>{d.emoji} {d.name}</option>)}
        </select>
      </div>
      {!dest ? (
        <div className="empty-state"><div className="emoji">🧳</div><h3>Selecione um destino acima</h3></div>
      ) : (
        <>
          <div className="grid-3 mb-20">
            {[
              ['Destino', `${dest.emoji} ${dest.name}`],
              ['Progresso', `${doneCount} / ${allActs.length} atividades`],
              ['Hoje', new Date().toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: 'short' })],
            ].map(([label, val]) => (
              <div key={label} style={{ background: 'var(--bg2)', border: '1px solid var(--border)', borderRadius: 12, padding: '14px 18px' }}>
                <p className="text-xs text-muted mb-8">{label}</p>
                <p style={{ fontSize: 14, fontWeight: 500 }}>{val}</p>
              </div>
            ))}
          </div>

          {todayActs.length > 0 && (
            <div className="card mb-20" style={{ borderLeft: '2px solid var(--accent)' }}>
              <p style={{ fontWeight: 500, marginBottom: 10, fontSize: 14 }}>📍 Hoje</p>
              {todayActs.map((a, i) => (
                <div key={i} className={`check-item ${a.done ? 'done' : ''}`}>
                  <span>{a.done ? '✅' : '⏳'}</span>
                  <span style={{ fontSize: 13 }}>{a.text}</span>
                </div>
              ))}
            </div>
          )}

          {(dest.itinerary || []).map((day, di) => {
            const done = (day.activities || []).filter(a => a.done).length;
            const isToday = day.date === today;
            return (
              <div key={di} className="day-card" style={{ borderColor: isToday ? 'var(--accent-border)' : undefined }}>
                <div className="day-header">
                  <div className="flex items-center gap-12">
                    <span className="day-number">Dia {di + 1}</span>
                    <span className="text-sm text-muted">{new Date(day.date + 'T12:00:00').toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: 'short' })}</span>
                    {isToday && <span className="badge badge-accent">Hoje</span>}
                  </div>
                  <span className="badge badge-green">{done}/{(day.activities || []).length}</span>
                </div>
                <div className="day-body">
                  {(day.activities || []).map((act, ai) => (
                    <div key={ai} className={`check-item ${act.done ? 'done' : ''}`}>
                      <span>{act.done ? '✅' : '⬜'}</span>
                      <span style={{ flex: 1, fontSize: 13 }}>{act.text}</span>
                    </div>
                  ))}
                  {(day.activities || []).length === 0 && <p className="text-sm text-muted">Nenhuma atividade</p>}
                </div>
              </div>
            );
          })}
        </>
      )}
    </div>
  );
}

// ─── Rates Page ───────────────────────────────────────────────────────────────
const CURRENCIES = ['EUR','USD','GBP','JPY','AED','THB','IDR','SGD','KRW','ARS','MXN','CLP','COP','PEN','HUF','CZK','MAD','AUD','TRY'];

function RatesPage({ rates, onSaveRates }) {
  const [local, setLocal] = useState(rates);
  const [saving, setSaving] = useState(false);
  const [saved, setSaved] = useState(false);

  useEffect(() => { setLocal(rates); }, [rates]);

  const handleSave = async () => {
    setSaving(true);
    await onSaveRates(local);
    setSaving(false);
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  };

  return (
    <div className="page">
      <div className="page-header flex justify-between items-center">
        <div>
          <h1 className="page-title">Cotações</h1>
          <p className="page-subtitle">Atualize antes de viajar — todos os destinos usam esses valores automaticamente</p>
        </div>
        <button className="btn btn-primary" onClick={handleSave} disabled={saving}>
          {saving ? <span className="spinner" /> : saved ? '✅' : <Icon name="check" />} {saved ? 'Salvo!' : 'Salvar'}
        </button>
      </div>
      <div className="grid-3">
        {CURRENCIES.map(cur => (
          <div key={cur} className="card-sm flex items-center gap-12">
            <div style={{ minWidth: 44 }}>
              <p style={{ fontWeight: 600, fontSize: 16 }}>{cur}</p>
              <p className="text-xs text-muted">1 {cur} =</p>
            </div>
            <div className="flex items-center gap-8" style={{ flex: 1 }}>
              <span className="text-sm text-muted">R$</span>
              <input
                type="number"
                className="form-input"
                style={{ flex: 1 }}
                placeholder="0,00"
                step="0.01"
                value={local[cur] || ''}
                onChange={e => setLocal(r => ({ ...r, [cur]: parseFloat(e.target.value) || 0 }))}
              />
            </div>
          </div>
        ))}
      </div>
      <p className="text-xs text-muted mt-16">💡 Atualize as cotações próximo à data da viagem. Os preços das atrações são convertidos automaticamente para reais em todos os destinos.</p>
    </div>
  );
}

// ─── Admin Page ───────────────────────────────────────────────────────────────
function AdminPage({ cityDB, onSaveCityDB }) {
  const [unlocked, setUnlocked] = useState(false);
  const [pwd, setPwd] = useState('');
  const [error, setError] = useState('');
  const [editingId, setEditingId] = useState(null);
  const [newCity, setNewCity] = useState(false);
  const [saving, setSaving] = useState(false);
  const [toast, setToast] = useState(null);

  const emptyForm = () => ({
    id: '', name: '', country: '', emoji: '🌍', currency: 'EUR',
    attractions: [],
    touristPass: { exists: false, name: '', price: '', currency: 'EUR', duration: '', includes: [], activationNote: '', buyLink: '' },
    cityTips: { transport: '', bestSeason: '', safety: '', payment: '', language: '', food: '' }
  });
  const [form, setForm] = useState(emptyForm());

  const startNew = () => { setForm(emptyForm()); setNewCity(true); setEditingId(null); };
  const startEdit = city => { setForm(JSON.parse(JSON.stringify(city))); setEditingId(city.id); setNewCity(false); };
  const cancel = () => { setNewCity(false); setEditingId(null); };

  const handleSave = async () => {
    setSaving(true);
    const city = { ...form, id: form.id || form.name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, '-') };
    const updated = editingId ? cityDB.map(c => c.id === editingId ? city : c) : [...cityDB, city];
    await onSaveCityDB(updated);
    setSaving(false);
    setNewCity(false);
    setEditingId(null);
    setToast('Cidade salva!');
  };

  const handleDelete = async id => {
    await onSaveCityDB(cityDB.filter(c => c.id !== id));
    setToast('Cidade removida');
  };

  if (!unlocked) return (
    <div className="page">
      <div className="page-header"><h1 className="page-title">Admin</h1><p className="page-subtitle">Área restrita — gerencie o banco de cidades</p></div>
      <div style={{ textAlign: 'center', padding: '60px 20px' }}>
        <div style={{ fontSize: 48, marginBottom: 16 }}>🔒</div>
        <p className="text-muted mb-16">Digite a senha para acessar</p>
        <div style={{ display: 'flex', gap: 8, maxWidth: 300, margin: '0 auto' }}>
          <input type="password" className="form-input" placeholder="Senha" value={pwd} onChange={e => setPwd(e.target.value)} onKeyDown={e => e.key === 'Enter' && (pwd === 'Lalu@viagens' ? setUnlocked(true) : setError('Senha incorreta'))} autoFocus />
          <button className="btn btn-primary" onClick={() => pwd === 'Lalu@viagens' ? setUnlocked(true) : setError('Senha incorreta')}><Icon name="lock" /></button>
        </div>
        {error && <p style={{ color: 'var(--red)', marginTop: 10, fontSize: 13 }}>{error}</p>}
      </div>
    </div>
  );

  const showForm = newCity || editingId;

  return (
    <div className="page">
      <div className="page-header flex justify-between items-center">
        <div><h1 className="page-title">Admin</h1><p className="page-subtitle">{cityDB.length} cidades no banco</p></div>
        {!showForm && <button className="btn btn-primary" onClick={startNew}><Icon name="plus" /> Nova cidade</button>}
      </div>

      {showForm && (
        <div className="card mb-20">
          <p style={{ fontWeight: 500, marginBottom: 14 }}>{editingId ? `Editando: ${form.name}` : 'Nova cidade'}</p>
          <div className="grid-3 mb-12">
            <div className="form-group" style={{ marginBottom: 0 }}><label className="form-label">Nome</label><input className="form-input" value={form.name} onChange={e => setForm(f => ({ ...f, name: e.target.value }))} autoFocus /></div>
            <div className="form-group" style={{ marginBottom: 0 }}><label className="form-label">País</label><input className="form-input" value={form.country} onChange={e => setForm(f => ({ ...f, country: e.target.value }))} /></div>
            <div className="form-group" style={{ marginBottom: 0 }}><label className="form-label">Emoji</label><input className="form-input" value={form.emoji} onChange={e => setForm(f => ({ ...f, emoji: e.target.value }))} /></div>
          </div>
          <div className="form-group mb-12" style={{ maxWidth: 120 }}><label className="form-label">Moeda (código)</label><input className="form-input" value={form.currency} onChange={e => setForm(f => ({ ...f, currency: e.target.value }))} /></div>

          <div className="section-divider">tourist pass</div>
          <div className="flex items-center gap-12 mb-10">
            <label className="form-label" style={{ marginBottom: 0 }}>Tem tourist pass?</label>
            <input type="checkbox" checked={form.touristPass?.exists || false} onChange={e => setForm(f => ({ ...f, touristPass: { ...f.touristPass, exists: e.target.checked } }))} />
          </div>
          {form.touristPass?.exists && (
            <div className="grid-2 mb-12">
              <div className="form-group"><label className="form-label">Nome do pass</label><input className="form-input" value={form.touristPass.name} onChange={e => setForm(f => ({ ...f, touristPass: { ...f.touristPass, name: e.target.value } }))} /></div>
              <div className="form-group"><label className="form-label">Preço</label><input type="number" className="form-input" value={form.touristPass.price} onChange={e => setForm(f => ({ ...f, touristPass: { ...f.touristPass, price: parseFloat(e.target.value) || 0 } }))} /></div>
              <div className="form-group"><label className="form-label">Moeda do pass</label><input className="form-input" value={form.touristPass.currency} onChange={e => setForm(f => ({ ...f, touristPass: { ...f.touristPass, currency: e.target.value } }))} /></div>
              <div className="form-group"><label className="form-label">Duração</label><input className="form-input" value={form.touristPass.duration} onChange={e => setForm(f => ({ ...f, touristPass: { ...f.touristPass, duration: e.target.value } }))} /></div>
              <div className="form-group" style={{ gridColumn: '1/-1' }}><label className="form-label">Nota de ativação</label><input className="form-input" value={form.touristPass.activationNote} onChange={e => setForm(f => ({ ...f, touristPass: { ...f.touristPass, activationNote: e.target.value } }))} /></div>
              <div className="form-group" style={{ gridColumn: '1/-1' }}><label className="form-label">Link de compra</label><input className="form-input" value={form.touristPass.buyLink} onChange={e => setForm(f => ({ ...f, touristPass: { ...f.touristPass, buyLink: e.target.value } }))} /></div>
            </div>
          )}

          <div className="section-divider">dicas da cidade</div>
          <div className="grid-2">
            {[['Transporte', 'transport'], ['Melhor época', 'bestSeason'], ['Idioma', 'language'], ['Segurança', 'safety'], ['Pagamento', 'payment'], ['Gastronomia', 'food']].map(([label, key]) => (
              <div key={key} className="form-group">
                <label className="form-label">{label}</label>
                <textarea className="form-input" style={{ minHeight: 60 }} value={form.cityTips?.[key] || ''} onChange={e => setForm(f => ({ ...f, cityTips: { ...f.cityTips, [key]: e.target.value } }))} />
              </div>
            ))}
          </div>
          <p className="text-xs text-muted mb-12">Atrações podem ser adicionadas dentro do destino após salvar.</p>
          <div className="flex gap-8">
            <button className="btn btn-primary" onClick={handleSave} disabled={saving || !form.name}>
              {saving ? <span className="spinner" /> : <Icon name="check" />} Salvar cidade
            </button>
            <button className="btn btn-ghost" onClick={cancel}>Cancelar</button>
          </div>
        </div>
      )}

      <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
        {cityDB.map(city => (
          <div key={city.id} className="card-sm flex justify-between items-center">
            <div className="flex items-center gap-12">
              <span style={{ fontSize: 24 }}>{city.emoji}</span>
              <div>
                <p style={{ fontWeight: 500, fontSize: 14 }}>{city.name}</p>
                <p className="text-xs text-muted">{city.country} · {city.attractions?.length || 0} atrações · {city.currency}</p>
              </div>
              {city.touristPass?.exists && <span className="badge badge-accent"><Icon name="ticket" size={10} /> Pass</span>}
            </div>
            <div className="flex gap-6">
              <button className="btn-icon" style={{ padding: 6 }} onClick={() => startEdit(city)}><Icon name="edit" size={13} /></button>
              <button className="btn-icon" style={{ padding: 6 }} onClick={() => handleDelete(city.id)}><Icon name="trash" size={13} /></button>
            </div>
          </div>
        ))}
      </div>
      {toast && <Toast message={toast} onClose={() => setToast(null)} />}
    </div>
  );
}

// ─── App Root ─────────────────────────────────────────────────────────────────
function App() {
  const [page, setPage] = useState('destinations');
  const [destinations, setDestinations] = useState([]);
  const [selectedDest, setSelectedDest] = useState(null);
  const [showNewDest, setShowNewDest] = useState(false);
  const [rates, setRates] = useState({});
  const [cityDB, setCityDB] = useState([]);
  const [loading, setLoading] = useState(true);
  const [toast, setToast] = useState(null);

  useEffect(() => {
    Promise.all([
      loadDestinations(),
      loadRates(),
      loadCityDB().then(async dbFirestore => {
        if (dbFirestore.length > 0) return dbFirestore;
        try {
          const res = await fetch('./data.json');
          const json = await res.json();
          return json.cities || [];
        } catch { return []; }
      })
    ]).then(([dests, r, db]) => {
      setDestinations(dests);
      setRates(r);
      setCityDB(db);
      setLoading(false);
    });
  }, []);

  const handleSaveDest = async dest => {
    const id = await saveDestination(dest);
    const nd = { ...dest, id };
    setDestinations(prev => {
      const idx = prev.findIndex(d => d.id === id);
      if (idx >= 0) { const n = [...prev]; n[idx] = nd; return n; }
      return [nd, ...prev];
    });
    if (selectedDest?.id === id) setSelectedDest(nd);
    setToast('Salvo! ✅');
  };

  const handleDeleteDest = async id => {
    await deleteDestination(id);
    setDestinations(prev => prev.filter(d => d.id !== id));
    setToast('Destino removido');
  };

  const handleSaveRates = async r => {
    await saveRates(r);
    setRates(r);
  };

  const handleSaveCityDB = async cities => {
    await saveCityDB(cities);
    setCityDB(cities);
  };

  const navItems = [
    { id: 'destinations', label: 'Destinos', icon: 'plane' },
    { id: 'compare', label: 'Comparativo', icon: 'compare' },
    { id: 'itinerary', label: 'Modo viagem', icon: 'map' },
    { id: 'rates', label: 'Cotações', icon: 'currency' },
    { id: 'admin', label: 'Admin', icon: 'admin' },
  ];

  const navigate = (p) => { setPage(p); setSelectedDest(null); };

  return (
    <div className="app">
      <div className="sidebar">
        <div className="sidebar-logo">
          <h1>Viagens Lalu ✈️</h1>
          <p>Planejamento de viagens</p>
        </div>
        <nav className="sidebar-nav">
          {navItems.map(item => (
            <button key={item.id} className={`nav-item ${page === item.id && !selectedDest ? 'active' : ''}`} onClick={() => navigate(item.id)}>
              <Icon name={item.icon} />{item.label}
            </button>
          ))}
        </nav>
      </div>
      <main className="main">
        {loading ? (
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: 60, color: 'var(--text2)' }}>
            <div className="spinner" /> Carregando...
          </div>
        ) : selectedDest ? (
          <DestinationDetail dest={selectedDest} onUpdate={handleSaveDest} onBack={() => setSelectedDest(null)} rates={rates} />
        ) : page === 'destinations' ? (
          <DestinationsPage destinations={destinations} onAdd={() => setShowNewDest(true)} onSelect={setSelectedDest} onDelete={handleDeleteDest} />
        ) : page === 'compare' ? (
          <ComparePage destinations={destinations} rates={rates} />
        ) : page === 'itinerary' ? (
          <ItineraryPage destinations={destinations} />
        ) : page === 'rates' ? (
          <RatesPage rates={rates} onSaveRates={handleSaveRates} />
        ) : (
          <AdminPage cityDB={cityDB} onSaveCityDB={handleSaveCityDB} />
        )}
      </main>
      {showNewDest && <NewDestinationModal onClose={() => setShowNewDest(false)} onSave={handleSaveDest} cityDB={cityDB} />}
      {toast && <Toast message={toast} onClose={() => setToast(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
